<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | AmbiVision</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/clash-display" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem;">
  <div style="max-width:520px; width:100%;">
    <div style="font-family:'Clash Display',sans-serif; font-size:7rem; font-weight:700; line-height:1; background:linear-gradient(135deg,#2563eb,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:1rem;">404</div>
    <h1 style="font-family:'Clash Display',sans-serif; font-size:1.75rem; font-weight:700; margin-bottom:1rem; color:var(--c-text-primary);">Page Not Found</h1>
    <p style="color:var(--c-text-secondary); font-size:1rem; line-height:1.7; margin-bottom:2.5rem;">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
      <a href="../index.html" class="btn btn-primary">← Back to Home</a>
      <a href="../index.html#contact" class="btn btn-ghost">Contact Us</a>
    </div>
  </div>
  <script>lucide && lucide.createIcons();</script>
</body>
</html>
